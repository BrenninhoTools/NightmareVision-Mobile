name: Binaries

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev

    workflow_dispatch:
    workflow_call:
        inputs:
            buildFlags:
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HAXE_VERSION: 4.3.7
    NDK_VERSION: r25c
    HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
    HXCPP_COMPILE_THREADS: 8
    LIME_HASH: 6421de16b9dfa4fb55c19f12db65d392a57585c8
    BUILD_FLAGS: ${{ inputs.buildFlags }}

jobs:
    Android:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 17

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                log-accepted-android-sdk-licenses: false

            - name: Setup Android NDK
              id: setup-ndk
              uses: nttld/setup-ndk@v1
              with:
                ndk-version: ${{ env.NDK_VERSION }}
                add-to-path: false
                local-cache: true

            - uses: krdlab/setup-haxe@v2.1.0
              with:
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Restore libs
              id: cache-libs
              uses: actions/cache@v4
              with:
                path: .haxelib
                key: android-libs-${{ env.LIME_HASH }}-${{ env.NDK_VERSION }}-${{ hashFiles('.hxpkg') }}

            - name: Restore hxcpp cache
              uses: actions/cache@v4
              with:
                path: .hxcpp_cache
                key: android-hxcpp-${{ github.sha }}
                restore-keys: android-hxcpp-

            - name: Restore Gradle cache
              uses: actions/cache@v4
              with:
                path: |
                  ~/.gradle/caches
                  ~/.gradle/wrapper
                key: android-gradle-${{ hashFiles('Project.xml') }}
                restore-keys: android-gradle-

            - name: Install libs
              if: steps.cache-libs.outputs.cache-hit != 'true'
              run: |
                set -euo pipefail
                haxelib setup ~/haxelib
                haxelib install hxpkg --quiet
                haxelib run hxpkg install
                rm -rf .haxelib/lime
                git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
                git -C .haxelib/lime/git checkout ${{ env.LIME_HASH }}
                git -C .haxelib/lime/git submodule update --init --recursive --force --depth 1
                haxelib dev lime .haxelib/lime/git

            - name: Configure Lime
              run: |
                haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
                haxelib run lime config ANDROID_NDK_ROOT "${{ steps.setup-ndk.outputs.ndk-path }}"
                haxelib run lime config JAVA_HOME "$JAVA_HOME"
                haxelib run lime config ANDROID_SETUP true

            - name: Rebuild Lime (Android)
              if: steps.cache-libs.outputs.cache-hit != 'true'
              run: haxelib run lime rebuild android -release -arm64

            - name: Compile build
              run: |
                FLAGS=""
                if [ -n "$BUILD_FLAGS" ]; then FLAGS="-D $BUILD_FLAGS"; fi
                haxelib run lime build Project.xml android -release -arm64 $FLAGS

            - name: Sign APK
              run: |
                set -euo pipefail
                APK_DIR=export/release/android/bin/app/build/outputs/apk/release
                UNSIGNED=$(find "$APK_DIR" -name "*.apk" | head -n 1)
                BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
                keytool -genkeypair -keystore release.keystore -alias nightmarevision -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass android -keypass android -dname "CN=NightmareVision, OU=Mobile, O=nmvTeam, C=BR"
                mkdir -p export/release/android/signed
                "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" export/release/android/signed/aligned.apk
                "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-key-alias nightmarevision --ks-pass pass:android --key-pass pass:android \
                  --out export/release/android/signed/NightmareVision.apk export/release/android/signed/aligned.apk
                rm export/release/android/signed/aligned.apk

            - name: Publish artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (Android)
                path: export/release/android/signed/NightmareVision.apk
                compression-level: 0

    iOS:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true

            - uses: krdlab/setup-haxe@v2.1.0
              with:
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Restore libs
              id: cache-libs
              uses: actions/cache@v4
              with:
                path: .haxelib
                key: ios-libs-${{ env.LIME_HASH }}-${{ hashFiles('.hxpkg') }}

            - name: Restore hxcpp cache
              uses: actions/cache@v4
              with:
                path: .hxcpp_cache
                key: ios-hxcpp-${{ github.sha }}
                restore-keys: ios-hxcpp-

            - name: Install libs
              if: steps.cache-libs.outputs.cache-hit != 'true'
              run: |
                set -euo pipefail
                haxelib setup ~/haxelib
                haxelib install hxpkg --quiet
                haxelib run hxpkg install
                rm -rf .haxelib/lime
                git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
                git -C .haxelib/lime/git checkout ${{ env.LIME_HASH }}
                git -C .haxelib/lime/git submodule update --init --recursive --force --depth 1
                haxelib dev lime .haxelib/lime/git

            - name: Rebuild Lime (iOS)
              if: steps.cache-libs.outputs.cache-hit != 'true'
              run: haxelib run lime rebuild ios -release

            - name: Compile build
              run: |
                FLAGS=""
                if [ -n "$BUILD_FLAGS" ]; then FLAGS="-D $BUILD_FLAGS"; fi
                haxelib run lime build Project.xml ios -release -nosign $FLAGS

            - name: Package IPA
              run: |
                set -euo pipefail
                cd export/release/ios/build/Release-iphoneos
                rm -rf Payload
                mkdir Payload
                cp -R *.app Payload/
                zip -qry NightmareVision.ipa Payload

            - name: Publish artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (iOS)
                path: export/release/ios/build/Release-iphoneos/NightmareVision.ipa
                compression-level: 0
