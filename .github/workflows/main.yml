name: Binaries

on:
    push:
        branches:
            - dev
        paths-ignore:
            - '**.md'
            - '**.txt'
            - 'LICENSE'
            - '.vscode/**'
    pull_request:
        branches:
            - dev
        paths-ignore:
            - '**.md'
            - '**.txt'
            - 'LICENSE'
            - '.vscode/**'

    workflow_dispatch:
        inputs:
            platform:
                description: Platforms to build
                type: choice
                default: both
                options:
                    - both
                    - android
                    - ios
            clean:
                description: Ignore build caches and compile from scratch
                type: boolean
                default: false
            astc:
                description: Generate ASTC textures
                type: boolean
                default: true
            buildFlags:
                description: Extra define passed with -D
                required: false
                type: string
    workflow_call:
        inputs:
            buildFlags:
                required: false
                type: string
            platform:
                required: false
                type: string
                default: both
            clean:
                required: false
                type: boolean
                default: false
            astc:
                required: false
                type: boolean
                default: true
            store:
                required: false
                type: boolean
                default: false
            buildNumber:
                required: false
                type: string
                default: ''

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HAXE_VERSION: 4.3.7
    NDK_MAJOR: 27
    NDK_VERSION: 27.2.12479018
    ANDROID_PLATFORM: 28
    LIME_HASH: 6421de16b9dfa4fb55c19f12db65d392a57585c8
    LIME_DIR: ${{ github.workspace }}/.lime
    HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
    BUILD_FLAGS: ${{ inputs.buildFlags }}
    GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.vfs.watch=false
    ANDROID_GRADLE_TASK: assembleDebug --build-cache --parallel --no-watch-fs
    CACHE_LIMIT_MB: 3500
    OUTPUT_CACHE_VERSION: v2
    CACHE_SAVE_MIN_NEW: 25
    ASTC_ENABLED: ${{ inputs.astc == false && 'false' || 'true' }}
    ASTC_COMPRESSOR_REF: b7a91b3072dc16e785a9bde847f17ba0ef15dd47
    ASTC_BLOCK: 6x6
    ASTC_QUALITY: medium
    BUILD_MODE: release
    STORE_BUILD: ${{ inputs.store && 'true' || 'false' }}
    STORE_BUILD_NUMBER: ${{ inputs.buildNumber }}
    STORE_BUNDLE_ID: com.nmvTeam.nightmareEngine
    CLEAN_BUILD: ${{ inputs.clean && 'true' || 'false' }}

jobs:
    Android:
        if: ${{ !inputs.platform || inputs.platform == 'both' || inputs.platform == 'android' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 75

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true
                fetch-depth: 1

            - name: Restore build output
              id: output
              if: ${{ env.CLEAN_BUILD != 'true' && env.STORE_BUILD != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: export/release/android/signed/NightmareVision.apk
                key: android-output-${{ env.OUTPUT_CACHE_VERSION }}-${{ env.BUILD_MODE }}-${{ env.ASTC_ENABLED }}-${{ env.LIME_HASH }}-${{ inputs.buildFlags }}-${{ hashFiles('source/**', 'assets/**', 'Project.xml', '.hxpkg', 'projFiles/**', '.github/workflows/main.yml', '.github/scripts/**') }}

            - name: Setup environment
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 10
              run: |
                set -euo pipefail
                echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
                echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
                echo "ANDROID_SETUP=true" >> "$GITHUB_ENV"
                echo "HXCPP_COMPILE_THREADS=$(( $(nproc) + 1 ))" >> "$GITHUB_ENV"
                NDK=""
                for candidate in $(ls -d "$ANDROID_HOME"/ndk/"$NDK_MAJOR".* 2>/dev/null | sort -V -r); do
                  if [ -x "$candidate/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then NDK="$candidate"; break; fi
                done
                if [ -z "$NDK" ]; then
                  (yes || true) | timeout 600 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
                  NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
                fi
                test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
                echo "Using NDK $(basename "$NDK")"
                echo "NDK_RESOLVED=$(basename "$NDK")" >> "$GITHUB_ENV"
                echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
                echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
                echo "ANDROID_NDK_LATEST_HOME=$NDK" >> "$GITHUB_ENV"

            - uses: krdlab/setup-haxe@v2.1.0
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 10
              with:
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Setup haxelib
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 5
              run: haxelib setup ~/haxelib < /dev/null

            - name: Restore libs
              id: libs
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: .haxelib
                key: android-hxpkg-v4-${{ hashFiles('.hxpkg') }}

            - name: Install libs
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.libs.outputs.cache-hit != 'true') }}
              timeout-minutes: 20
              run: |
                set -euo pipefail
                haxelib install hxpkg --quiet --always < /dev/null
                haxelib run hxpkg install < /dev/null

            - name: Save libs
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.libs.outputs.cache-hit != 'true') }}
              uses: actions/cache/save@v4
              with:
                path: .haxelib
                key: ${{ steps.libs.outputs.cache-primary-key }}

            - name: Restore Lime
              id: lime
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: android-lime-v4-${{ env.LIME_HASH }}-${{ env.NDK_RESOLVED }}-${{ env.ANDROID_PLATFORM }}

            - name: Install Linux dependencies
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.lime.outputs.cache-hit != 'true') }}
              timeout-minutes: 10
              run: |
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends \
                  build-essential pkg-config \
                  libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
                  libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev libgbm-dev libdrm-dev libvulkan-dev \
                  libasound2-dev libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libsndio-dev \
                  libdbus-1-dev libudev-dev libibus-1.0-dev \
                  libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev libxss-dev libxrender-dev \
                  libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev

            - name: Build Lime
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.lime.outputs.cache-hit != 'true') }}
              timeout-minutes: 40
              run: |
                set -euo pipefail
                rm -rf "$LIME_DIR"
                git init -q "$LIME_DIR"
                git -C "$LIME_DIR" remote add origin https://github.com/FunkinCrew/lime
                git -C "$LIME_DIR" fetch -q --depth 1 origin "$LIME_HASH"
                git -C "$LIME_DIR" checkout -q FETCH_HEAD
                git -C "$LIME_DIR" submodule update -q --init --recursive --force --depth 1 --jobs 8
                haxelib dev lime "$LIME_DIR" < /dev/null
                CC=gcc CXX=g++ haxelib run lime rebuild linux -64 -release < /dev/null
                test -f "$LIME_DIR/ndll/Linux64/lime.ndll"
                cd "$LIME_DIR/project"
                unset CC CXX
                export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
                haxelib run hxcpp Build.xml -Dandroid -DHXCPP_ARM64 -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
                  -DPLATFORM=android-$ANDROID_PLATFORM -DHXCPP_ANDROID_PLATFORM=$ANDROID_PLATFORM < /dev/null
                ls "$LIME_DIR/ndll/Android"
                rm -rf "$LIME_DIR/.git" "$LIME_DIR/project/obj"

            - name: Save Lime
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.lime.outputs.cache-hit != 'true') }}
              uses: actions/cache/save@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: ${{ steps.lime.outputs.cache-primary-key }}

            - name: Link Lime
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              run: haxelib dev lime "$LIME_DIR" < /dev/null

            - name: Restore hxcpp cache
              id: hxcpp
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.CLEAN_BUILD != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.HXCPP_COMPILE_CACHE }}
                key: android-hxcpp-v4-${{ hashFiles('source/**', 'Project.xml', '.hxpkg') }}
                restore-keys: android-hxcpp-v4-

            - name: Restore Gradle cache
              id: gradle
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: |
                  ~/.gradle/caches
                  ~/.gradle/wrapper
                key: android-gradle-v4-${{ hashFiles('Project.xml', '.hxpkg', 'projFiles/android/**') }}
                restore-keys: android-gradle-v4-

            - name: Configure Gradle
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              run: |
                mkdir -p ~/.gradle/init.d
                cat > ~/.gradle/init.d/fast-build.gradle <<'GRADLE'
                allprojects {
                    tasks.configureEach { task ->
                        def name = task.name.toLowerCase()
                        if (name.contains('lint') || name.contains('unittest') || name.contains('androidtest')) task.enabled = false
                    }
                }
                GRADLE
                printf 'org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.configureondemand=true\n' > ~/.gradle/gradle.properties

            - name: Restore ASTC textures
              id: astc
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.ASTC_ENABLED == 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: |
                  assets/**/*.astc
                  .astc-cache/hashes.json
                key: linux-astc-${{ env.ASTC_BLOCK }}-${{ env.ASTC_QUALITY }}-${{ hashFiles('assets/**/*.png', '.github/astc-excludes.txt') }}
                restore-keys: |
                  linux-astc-${{ env.ASTC_BLOCK }}-${{ env.ASTC_QUALITY }}-

            - name: Compress ASTC textures
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.ASTC_ENABLED == 'true' && steps.astc.outputs.cache-hit != 'true' }}
              run: |
                set -uo pipefail
                python3 .github/scripts/astc_prepare.py assets .astc-cache/hashes.json prepare
                rm -rf .astc-cache/compressor
                git clone -q https://github.com/KarimAkra/astc-compressor.git .astc-cache/compressor
                git -C .astc-cache/compressor checkout -q "$ASTC_COMPRESSOR_REF"
                haxelib dev astc-compressor .astc-cache/compressor < /dev/null
                chmod +x .astc-cache/compressor/plugins/*/*/* .astc-cache/compressor/plugins/MacOS/* 2>/dev/null || true
                haxelib run astc-compressor compress -i assets -blocksize "$ASTC_BLOCK" -quality "$ASTC_QUALITY" -colorprofile cl -excludes .github/astc-excludes.txt < /dev/null || echo "ASTC compression failed, continuing with PNG only"
                python3 .github/scripts/astc_prepare.py assets .astc-cache/hashes.json write
                rm -rf .astc-cache/compressor
                echo "ASTC textures: $(find assets -name '*.astc' | wc -l | tr -d ' ')"

            - name: Save ASTC textures
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.ASTC_ENABLED == 'true' && steps.astc.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
              uses: actions/cache/save@v4
              with:
                path: |
                  assets/**/*.astc
                  .astc-cache/hashes.json
                key: linux-astc-${{ env.ASTC_BLOCK }}-${{ env.ASTC_QUALITY }}-${{ hashFiles('assets/**/*.png', '.github/astc-excludes.txt') }}

            - name: Compile build
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 50
              run: |
                set -euo pipefail
                python3 .github/scripts/prune_cache.py "$HXCPP_COMPILE_CACHE" "$CACHE_LIMIT_MB" 0.75
                mkdir -p "$HXCPP_COMPILE_CACHE"
                HXCPP_FILES_BEFORE=$(find "$HXCPP_COMPILE_CACHE" -type f | wc -l | tr -d ' ')
                echo "HXCPP_FILES_BEFORE=$HXCPP_FILES_BEFORE" >> "$GITHUB_ENV"
                echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
                if [ -d "$HXCPP_COMPILE_CACHE" ]; then find "$HXCPP_COMPILE_CACHE" -type d -name "pch*" -prune -exec rm -rf {} +; fi
                FLAGS=""
                if [ -n "${BUILD_FLAGS:-}" ]; then FLAGS="-D $BUILD_FLAGS"; fi
                if [ "$STORE_BUILD" = "true" ]; then
                  export ANDROID_GRADLE_TASK="bundleRelease --build-cache --parallel --no-watch-fs"
                  if [ -n "$STORE_BUILD_NUMBER" ]; then FLAGS="$FLAGS -DNMV_BUILD_NUMBER=$STORE_BUILD_NUMBER"; fi
                fi
                unset CC CXX
                export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
                haxelib run lime build Project.xml android -$BUILD_MODE -arm64 $FLAGS < /dev/null
                echo "HXCPP_NEW_FILES=$(( $(find "$HXCPP_COMPILE_CACHE" -type f | wc -l | tr -d ' ') - ${HXCPP_FILES_BEFORE:-0} ))" >> "$GITHUB_ENV"

            - name: Save hxcpp cache
              if: ${{ steps.output.outputs.cache-hit != 'true' && (!cancelled() && steps.hxcpp.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (steps.hxcpp.outputs.cache-matched-key == '' || fromJSON(env.HXCPP_NEW_FILES || '0') >= fromJSON(env.CACHE_SAVE_MIN_NEW))) }}
              uses: actions/cache/save@v4
              with:
                path: ${{ env.HXCPP_COMPILE_CACHE }}
                key: ${{ steps.hxcpp.outputs.cache-primary-key }}

            - name: Save Gradle cache
              if: ${{ steps.output.outputs.cache-hit != 'true' && (!cancelled() && steps.gradle.outputs.cache-hit != 'true' && github.event_name != 'pull_request') }}
              uses: actions/cache/save@v4
              with:
                path: |
                  ~/.gradle/caches
                  ~/.gradle/wrapper
                key: ${{ steps.gradle.outputs.cache-primary-key }}

            - name: Sign AAB
              if: ${{ env.STORE_BUILD == 'true' }}
              timeout-minutes: 10
              env:
                KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                set -euo pipefail
                for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
                  if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; exit 1; fi
                done
                BUNDLE=$(find export/release/android/bin -path "*/outputs/bundle/release/*" -name "*.aab" | sort | head -n 1)
                echo "$BUNDLE"
                test -n "$BUNDLE"
                echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
                mkdir -p export/release/android/store
                cp "$BUNDLE" export/release/android/store/NightmareVision.aab
                jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.keystore" \
                  -storepass "$KEYSTORE_PASSWORD" -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
                  export/release/android/store/NightmareVision.aab "$KEY_ALIAS"
                jarsigner -verify export/release/android/store/NightmareVision.aab > /dev/null
                rm -f "$RUNNER_TEMP/upload.keystore"

            - name: Sign APK
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.STORE_BUILD != 'true' }}
              timeout-minutes: 10
              run: |
                set -euo pipefail
                UNSIGNED=$(find export/release/android/bin -path "*/outputs/apk/*" -name "*.apk" | sort | head -n 1)
                if [ -z "$UNSIGNED" ]; then UNSIGNED=$(find export/release/android/bin -name "*.apk" | sort | head -n 1); fi
                echo "$UNSIGNED"
                test -n "$UNSIGNED"
                BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
                keytool -genkeypair -keystore release.keystore -alias nightmarevision -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass android -keypass android -dname "CN=NightmareVision, OU=Mobile, O=nmvTeam, C=BR"
                mkdir -p export/release/android/signed
                "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" export/release/android/signed/aligned.apk
                "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-key-alias nightmarevision --ks-pass pass:android --key-pass pass:android \
                  --out export/release/android/signed/NightmareVision.apk export/release/android/signed/aligned.apk
                rm export/release/android/signed/aligned.apk

            - name: Save build output
              if: ${{ steps.output.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && env.STORE_BUILD != 'true' }}
              uses: actions/cache/save@v4
              with:
                path: export/release/android/signed/NightmareVision.apk
                key: ${{ steps.output.outputs.cache-primary-key }}

            - name: Publish store artifact
              if: ${{ env.STORE_BUILD == 'true' }}
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (Android Store)
                path: export/release/android/store/NightmareVision.aab
                compression-level: 0

            - name: Publish artifact
              if: ${{ env.STORE_BUILD != 'true' }}
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (Android)
                path: export/release/android/signed/NightmareVision.apk
                compression-level: 0

            - name: Build summary
              if: ${{ always() }}
              run: |
                APK=export/release/android/signed/NightmareVision.apk
                {
                  echo "### Android"
                  echo "| Item | Value |"
                  echo "|---|---|"
                  echo "| Mode | $BUILD_MODE |"
                  echo "| Output cache | ${{ steps.output.outputs.cache-hit == 'true' && 'hit (build skipped)' || 'miss' }} |"
                  echo "| hxcpp cache | ${{ steps.hxcpp.outputs.cache-hit == 'true' && 'exact' || (steps.hxcpp.outputs.cache-matched-key != '' && 'partial' || 'none') }} |"
                  echo "| New compiled objects | ${HXCPP_NEW_FILES:-0} |"
                  if [ -n "${BUILD_STARTED:-}" ]; then echo "| Compile time | $(( $(date +%s) - BUILD_STARTED ))s |"; fi
                  if [ -f "$APK" ]; then echo "| APK size | $(du -h "$APK" | cut -f1) |"; fi
                } >> "$GITHUB_STEP_SUMMARY"

    iOS:
        if: ${{ !inputs.platform || inputs.platform == 'both' || inputs.platform == 'ios' }}
        runs-on: macos-latest
        timeout-minutes: 90

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true
                fetch-depth: 1

            - name: Restore build output
              id: output
              if: ${{ env.CLEAN_BUILD != 'true' && env.STORE_BUILD != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: export/release/ios/build/Release-iphoneos/NightmareVision.ipa
                key: ios-output-${{ env.OUTPUT_CACHE_VERSION }}-${{ env.BUILD_MODE }}-${{ env.ASTC_ENABLED }}-${{ env.LIME_HASH }}-${{ inputs.buildFlags }}-${{ hashFiles('source/**', 'assets/**', 'Project.xml', '.hxpkg', 'projFiles/**', '.github/workflows/main.yml', '.github/scripts/**') }}

            - name: Setup environment
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 5
              run: |
                echo "HXCPP_COMPILE_THREADS=$(( $(sysctl -n hw.ncpu) + 1 ))" >> "$GITHUB_ENV"
                echo "IPHONE_VER=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_ENV"

            - uses: krdlab/setup-haxe@v2.1.0
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 10
              with:
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Setup haxelib
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 5
              run: haxelib setup ~/haxelib < /dev/null

            - name: Restore libs
              id: libs
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: .haxelib
                key: ios-hxpkg-v4-${{ hashFiles('.hxpkg') }}

            - name: Install libs
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.libs.outputs.cache-hit != 'true') }}
              timeout-minutes: 20
              run: |
                set -euo pipefail
                haxelib install hxpkg --quiet --always < /dev/null
                haxelib run hxpkg install < /dev/null

            - name: Save libs
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.libs.outputs.cache-hit != 'true') }}
              uses: actions/cache/save@v4
              with:
                path: .haxelib
                key: ${{ steps.libs.outputs.cache-primary-key }}

            - name: Restore Lime
              id: lime
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: ios-lime-v4-${{ env.LIME_HASH }}-${{ env.IPHONE_VER }}

            - name: Build Lime
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.lime.outputs.cache-hit != 'true') }}
              timeout-minutes: 40
              run: |
                set -euo pipefail
                rm -rf "$LIME_DIR"
                git init -q "$LIME_DIR"
                git -C "$LIME_DIR" remote add origin https://github.com/FunkinCrew/lime
                git -C "$LIME_DIR" fetch -q --depth 1 origin "$LIME_HASH"
                git -C "$LIME_DIR" checkout -q FETCH_HEAD
                git -C "$LIME_DIR" submodule update -q --init --recursive --force --depth 1 --jobs 8
                haxelib dev lime "$LIME_DIR" < /dev/null
                haxelib run lime rebuild mac -release < /dev/null
                ls "$LIME_DIR"/ndll/Mac*/lime.ndll
                sed -i '' 's/return \[\[\[UIDevice currentDevice\] systemVersion\] UTF8String\];/return (char*)[[[UIDevice currentDevice] systemVersion] UTF8String];/' "$LIME_DIR/project/src/system/ios/System.mm"
                grep -q "return (char\*)\[\[\[UIDevice" "$LIME_DIR/project/src/system/ios/System.mm"
                cd "$LIME_DIR/project"
                haxelib run hxcpp Build.xml -Dios -DHXCPP_ARM64 -DIPHONE_VER=$IPHONE_VER < /dev/null
                ls "$LIME_DIR/ndll/iPhone"
                rm -rf "$LIME_DIR/.git" "$LIME_DIR/project/obj"

            - name: Save Lime
              if: ${{ steps.output.outputs.cache-hit != 'true' && (steps.lime.outputs.cache-hit != 'true') }}
              uses: actions/cache/save@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: ${{ steps.lime.outputs.cache-primary-key }}

            - name: Link Lime
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              run: haxelib dev lime "$LIME_DIR" < /dev/null

            - name: Restore hxcpp cache
              id: hxcpp
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.CLEAN_BUILD != 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.HXCPP_COMPILE_CACHE }}
                key: ios-hxcpp-v4-${{ hashFiles('source/**', 'Project.xml', '.hxpkg', 'projFiles/ios/**') }}
                restore-keys: ios-hxcpp-v4-

            - name: Restore ASTC textures
              id: astc
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.ASTC_ENABLED == 'true' }}
              uses: actions/cache/restore@v4
              with:
                path: |
                  assets/**/*.astc
                  .astc-cache/hashes.json
                key: macos-astc-${{ env.ASTC_BLOCK }}-${{ env.ASTC_QUALITY }}-${{ hashFiles('assets/**/*.png', '.github/astc-excludes.txt') }}
                restore-keys: |
                  macos-astc-${{ env.ASTC_BLOCK }}-${{ env.ASTC_QUALITY }}-

            - name: Compress ASTC textures
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.ASTC_ENABLED == 'true' && steps.astc.outputs.cache-hit != 'true' }}
              run: |
                set -uo pipefail
                python3 .github/scripts/astc_prepare.py assets .astc-cache/hashes.json prepare
                rm -rf .astc-cache/compressor
                git clone -q https://github.com/KarimAkra/astc-compressor.git .astc-cache/compressor
                git -C .astc-cache/compressor checkout -q "$ASTC_COMPRESSOR_REF"
                haxelib dev astc-compressor .astc-cache/compressor < /dev/null
                chmod +x .astc-cache/compressor/plugins/*/*/* .astc-cache/compressor/plugins/MacOS/* 2>/dev/null || true
                haxelib run astc-compressor compress -i assets -blocksize "$ASTC_BLOCK" -quality "$ASTC_QUALITY" -colorprofile cl -excludes .github/astc-excludes.txt < /dev/null || echo "ASTC compression failed, continuing with PNG only"
                python3 .github/scripts/astc_prepare.py assets .astc-cache/hashes.json write
                rm -rf .astc-cache/compressor
                echo "ASTC textures: $(find assets -name '*.astc' | wc -l | tr -d ' ')"

            - name: Save ASTC textures
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.ASTC_ENABLED == 'true' && steps.astc.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
              uses: actions/cache/save@v4
              with:
                path: |
                  assets/**/*.astc
                  .astc-cache/hashes.json
                key: macos-astc-${{ env.ASTC_BLOCK }}-${{ env.ASTC_QUALITY }}-${{ hashFiles('assets/**/*.png', '.github/astc-excludes.txt') }}

            - name: Prepare Xcode project
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 15
              run: |
                set -euo pipefail
                python3 .github/scripts/prune_cache.py "$HXCPP_COMPILE_CACHE" "$CACHE_LIMIT_MB" 0.75
                mkdir -p "$HXCPP_COMPILE_CACHE"
                HXCPP_FILES_BEFORE=$(find "$HXCPP_COMPILE_CACHE" -type f | wc -l | tr -d ' ')
                echo "HXCPP_FILES_BEFORE=$HXCPP_FILES_BEFORE" >> "$GITHUB_ENV"
                echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
                if [ -d "$HXCPP_COMPILE_CACHE" ]; then find "$HXCPP_COMPILE_CACHE" -type d -name "pch*" -prune -exec rm -rf {} +; fi
                FLAGS=""
                if [ -n "${BUILD_FLAGS:-}" ]; then FLAGS="-D $BUILD_FLAGS"; fi
                if [ "$STORE_BUILD" = "true" ] && [ -n "$STORE_BUILD_NUMBER" ]; then FLAGS="$FLAGS -DNMV_BUILD_NUMBER=$STORE_BUILD_NUMBER"; fi
                haxelib run lime update Project.xml ios -$BUILD_MODE -nosign $FLAGS < /dev/null

            - name: Compile Haxe (arm64)
              if: ${{ steps.output.outputs.cache-hit != 'true' }}
              timeout-minutes: 45
              run: |
                set -euo pipefail
                HAXE_DIR="$GITHUB_WORKSPACE/export/release/ios/NightmareVision/haxe"
                BUILD_DIR="$HAXE_DIR/build/Release-iphoneos-arm64"
                LIB_DIR="$GITHUB_WORKSPACE/export/release/ios/NightmareVision/lib/arm64"
                mkdir -p "$LIB_DIR"
                cd "$HAXE_DIR"
                haxe Build.hxml -D HXCPP_ARM64 -cpp "$BUILD_DIR" < /dev/null
                cd "$BUILD_DIR"
                haxelib run hxcpp Build.xml haxe -Ddestination="$LIB_DIR/libApplicationMain.a" -options Options.txt < /dev/null
                env -u HXCPP_COMPILE_CACHE haxelib run hxcpp "$HAXE_DIR/BuildHxcppMbedtls.xml" -Ddestination="$LIB_DIR/libmbedtls_hxcpp.a" -options "$BUILD_DIR/Options.txt" < /dev/null
                ls -la "$LIB_DIR"
                echo "HXCPP_NEW_FILES=$(( $(find "$HXCPP_COMPILE_CACHE" -type f | wc -l | tr -d ' ') - ${HXCPP_FILES_BEFORE:-0} ))" >> "$GITHUB_ENV"
                sed -i '' 's/^default: \$(HAXE_BUILDS)$/default:/' "$HAXE_DIR/makefile"
                grep -q '^default:$' "$HAXE_DIR/makefile"

            - name: Install signing assets
              if: ${{ env.STORE_BUILD == 'true' }}
              env:
                CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
                CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
                PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
                TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
              run: |
                set -euo pipefail
                for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 TEAM_ID; do
                  if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; exit 1; fi
                done
                KEYCHAIN="$RUNNER_TEMP/store.keychain-db"
                KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
                echo "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
                echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
                security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                security set-keychain-settings -lut 21600 "$KEYCHAIN"
                security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
                security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
                security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
                security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
                PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
                PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
                mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
                cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
                rm -f "$RUNNER_TEMP/certificate.p12"
                {
                  echo "STORE_KEYCHAIN=$KEYCHAIN"
                  echo "STORE_PROFILE_NAME=$PROFILE_NAME"
                  echo "STORE_TEAM_ID=$TEAM_ID"
                } >> "$GITHUB_ENV"

            - name: Archive app
              if: ${{ env.STORE_BUILD == 'true' }}
              timeout-minutes: 30
              run: |
                set -euo pipefail
                cd export/release/ios
                xcodebuild -project NightmareVision.xcodeproj -scheme NightmareVision -configuration Release \
                  -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/NightmareVision.xcarchive \
                  CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$STORE_TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
                  PROVISIONING_PROFILE_SPECIFIER="$STORE_PROFILE_NAME" OTHER_CODE_SIGN_FLAGS="--keychain $STORE_KEYCHAIN" \
                  PRODUCT_BUNDLE_IDENTIFIER="$STORE_BUNDLE_ID" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO ENABLE_BITCODE=NO \
                  COMPILER_INDEX_STORE_ENABLE=NO -jobs "$HXCPP_COMPILE_THREADS" archive -quiet < /dev/null
                cat > build/ExportOptions.plist <<PLIST
                <?xml version="1.0" encoding="UTF-8"?>
                <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                <plist version="1.0">
                <dict>
                  <key>method</key><string>app-store-connect</string>
                  <key>teamID</key><string>$STORE_TEAM_ID</string>
                  <key>signingStyle</key><string>manual</string>
                  <key>signingCertificate</key><string>Apple Distribution</string>
                  <key>provisioningProfiles</key>
                  <dict><key>$STORE_BUNDLE_ID</key><string>$STORE_PROFILE_NAME</string></dict>
                  <key>uploadSymbols</key><false/>
                  <key>manageAppVersionAndBuildNumber</key><false/>
                </dict>
                </plist>
                PLIST
                xcodebuild -exportArchive -archivePath build/NightmareVision.xcarchive -exportPath build/store \
                  -exportOptionsPlist build/ExportOptions.plist < /dev/null
                IPA=$(find build/store -name "*.ipa" | head -n 1)
                test -n "$IPA"
                mv "$IPA" build/store/NightmareVision.ipa

            - name: Remove signing assets
              if: ${{ always() && env.STORE_BUILD == 'true' }}
              run: |
                if [ -n "${STORE_KEYCHAIN:-}" ]; then security delete-keychain "$STORE_KEYCHAIN" || true; fi
                rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision

            - name: Link app
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.STORE_BUILD != 'true' }}
              timeout-minutes: 20
              run: |
                set -euo pipefail
                cd export/release/ios
                xcodebuild -project NightmareVision.xcodeproj -configuration Release -arch arm64 \
                  PLATFORM_NAME=iphoneos SDKROOT=iphoneos$IPHONE_VER -jobs "$HXCPP_COMPILE_THREADS" \
                  CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS= \
                  DEBUG_INFORMATION_FORMAT=dwarf GCC_GENERATE_DEBUGGING_SYMBOLS=NO COMPILER_INDEX_STORE_ENABLE=NO \
                  ONLY_ACTIVE_ARCH=YES ENABLE_BITCODE=NO build -quiet < /dev/null

            - name: Save hxcpp cache
              if: ${{ steps.output.outputs.cache-hit != 'true' && (!cancelled() && steps.hxcpp.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (steps.hxcpp.outputs.cache-matched-key == '' || fromJSON(env.HXCPP_NEW_FILES || '0') >= fromJSON(env.CACHE_SAVE_MIN_NEW))) }}
              uses: actions/cache/save@v4
              with:
                path: ${{ env.HXCPP_COMPILE_CACHE }}
                key: ${{ steps.hxcpp.outputs.cache-primary-key }}

            - name: Package IPA
              if: ${{ steps.output.outputs.cache-hit != 'true' && env.STORE_BUILD != 'true' }}
              timeout-minutes: 10
              run: |
                set -euo pipefail
                cd export/release/ios/build/Release-iphoneos
                rm -rf Payload
                mkdir Payload
                cp -R *.app Payload/
                zip -qry NightmareVision.ipa Payload

            - name: Save build output
              if: ${{ steps.output.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && env.STORE_BUILD != 'true' }}
              uses: actions/cache/save@v4
              with:
                path: export/release/ios/build/Release-iphoneos/NightmareVision.ipa
                key: ${{ steps.output.outputs.cache-primary-key }}

            - name: Publish store artifact
              if: ${{ env.STORE_BUILD == 'true' }}
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (iOS Store)
                path: export/release/ios/build/store/NightmareVision.ipa
                compression-level: 0

            - name: Publish artifact
              if: ${{ env.STORE_BUILD != 'true' }}
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (iOS)
                path: export/release/ios/build/Release-iphoneos/NightmareVision.ipa
                compression-level: 0

            - name: Build summary
              if: ${{ always() }}
              run: |
                IPA=export/release/ios/build/Release-iphoneos/NightmareVision.ipa
                {
                  echo "### iOS"
                  echo "| Item | Value |"
                  echo "|---|---|"
                  echo "| Mode | $BUILD_MODE |"
                  echo "| Output cache | ${{ steps.output.outputs.cache-hit == 'true' && 'hit (build skipped)' || 'miss' }} |"
                  echo "| hxcpp cache | ${{ steps.hxcpp.outputs.cache-hit == 'true' && 'exact' || (steps.hxcpp.outputs.cache-matched-key != '' && 'partial' || 'none') }} |"
                  echo "| New compiled objects | ${HXCPP_NEW_FILES:-0} |"
                  if [ -n "${BUILD_STARTED:-}" ]; then echo "| Compile time | $(( $(date +%s) - BUILD_STARTED ))s |"; fi
                  if [ -f "$IPA" ]; then echo "| IPA size | $(du -h "$IPA" | cut -f1) |"; fi
                } >> "$GITHUB_STEP_SUMMARY"
