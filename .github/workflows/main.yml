name: Binaries

on:
    push:
        branches:
            - dev
        paths-ignore:
            - '**.md'
            - '**.txt'
            - 'LICENSE'
            - '.vscode/**'
    pull_request:
        branches:
            - dev
        paths-ignore:
            - '**.md'
            - '**.txt'
            - 'LICENSE'
            - '.vscode/**'

    workflow_dispatch:
    workflow_call:
        inputs:
            buildFlags:
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    HAXE_VERSION: 4.3.7
    NDK_VERSION: r25c
    ANDROID_PLATFORM: 28
    LIME_HASH: 6421de16b9dfa4fb55c19f12db65d392a57585c8
    LIME_DIR: ${{ github.workspace }}/.lime
    HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
    BUILD_FLAGS: ${{ inputs.buildFlags }}

jobs:
    Android:
        runs-on: ubuntu-24.04
        timeout-minutes: 120

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true

            - name: Setup environment
              run: |
                echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
                echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
                echo "ANDROID_SETUP=true" >> "$GITHUB_ENV"
                echo "HXCPP_COMPILE_THREADS=$(nproc)" >> "$GITHUB_ENV"

            - name: Setup Android NDK
              id: setup-ndk
              uses: nttld/setup-ndk@v1
              with:
                ndk-version: ${{ env.NDK_VERSION }}
                add-to-path: false
                local-cache: true

            - name: Export NDK path
              run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

            - uses: krdlab/setup-haxe@v2.1.0
              with:
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Setup haxelib
              run: haxelib setup ~/haxelib

            - name: Restore libs
              id: libs
              uses: actions/cache/restore@v4
              with:
                path: .haxelib
                key: android-hxpkg-v3-${{ hashFiles('.hxpkg') }}

            - name: Install libs
              if: steps.libs.outputs.cache-hit != 'true'
              run: |
                set -euo pipefail
                haxelib install hxpkg --quiet
                haxelib run hxpkg install

            - name: Save libs
              if: steps.libs.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                path: .haxelib
                key: ${{ steps.libs.outputs.cache-primary-key }}

            - name: Restore Lime
              id: lime
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: android-lime-v3-${{ env.LIME_HASH }}-${{ env.NDK_VERSION }}-${{ env.ANDROID_PLATFORM }}

            - name: Install Linux dependencies
              if: steps.lime.outputs.cache-hit != 'true'
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  build-essential pkg-config \
                  libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
                  libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev libgbm-dev libdrm-dev libvulkan-dev \
                  libasound2-dev libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libsndio-dev \
                  libdbus-1-dev libudev-dev libibus-1.0-dev \
                  libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev libxss-dev libxrender-dev \
                  libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev

            - name: Build Lime
              if: steps.lime.outputs.cache-hit != 'true'
              timeout-minutes: 45
              run: |
                set -euo pipefail
                rm -rf "$LIME_DIR"
                git clone https://github.com/FunkinCrew/lime "$LIME_DIR"
                git -C "$LIME_DIR" checkout "$LIME_HASH"
                git -C "$LIME_DIR" submodule update --init --recursive --force --depth 1
                haxelib dev lime "$LIME_DIR"
                haxelib run lime rebuild linux -64 -release < /dev/null
                test -f "$LIME_DIR/ndll/Linux64/lime.ndll"
                cd "$LIME_DIR/project"
                haxelib run hxcpp Build.xml -Dandroid -DHXCPP_ARM64 \
                  -DPLATFORM=android-$ANDROID_PLATFORM -DHXCPP_ANDROID_PLATFORM=$ANDROID_PLATFORM < /dev/null
                ls "$LIME_DIR/ndll/Android"

            - name: Save Lime
              if: steps.lime.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: ${{ steps.lime.outputs.cache-primary-key }}

            - name: Link Lime
              run: haxelib dev lime "$LIME_DIR"

            - name: Restore build cache
              uses: actions/cache/restore@v4
              with:
                path: |
                  ${{ env.HXCPP_COMPILE_CACHE }}
                  ~/.gradle/caches
                  ~/.gradle/wrapper
                key: android-build-v3-${{ github.sha }}
                restore-keys: android-build-v3-

            - name: Compile build
              timeout-minutes: 75
              run: |
                FLAGS=""
                if [ -n "$BUILD_FLAGS" ]; then FLAGS="-D $BUILD_FLAGS"; fi
                haxelib run lime build Project.xml android -release -arm64 $FLAGS < /dev/null

            - name: Save build cache
              if: always()
              uses: actions/cache/save@v4
              with:
                path: |
                  ${{ env.HXCPP_COMPILE_CACHE }}
                  ~/.gradle/caches
                  ~/.gradle/wrapper
                key: android-build-v3-${{ github.sha }}

            - name: Sign APK
              run: |
                set -euo pipefail
                APK_DIR=export/release/android/bin/app/build/outputs/apk/release
                UNSIGNED=$(find "$APK_DIR" -name "*.apk" | head -n 1)
                BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
                keytool -genkeypair -keystore release.keystore -alias nightmarevision -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass android -keypass android -dname "CN=NightmareVision, OU=Mobile, O=nmvTeam, C=BR"
                mkdir -p export/release/android/signed
                "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" export/release/android/signed/aligned.apk
                "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-key-alias nightmarevision --ks-pass pass:android --key-pass pass:android \
                  --out export/release/android/signed/NightmareVision.apk export/release/android/signed/aligned.apk
                rm export/release/android/signed/aligned.apk

            - name: Publish artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (Android)
                path: export/release/android/signed/NightmareVision.apk
                compression-level: 0

    iOS:
        runs-on: macos-15
        timeout-minutes: 120

        steps:
            - uses: actions/checkout@v7
              with:
                submodules: true

            - name: Setup environment
              run: |
                echo "HXCPP_COMPILE_THREADS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
                echo "IPHONE_VER=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_ENV"

            - uses: krdlab/setup-haxe@v2.1.0
              with:
                haxe-version: ${{ env.HAXE_VERSION }}

            - name: Setup haxelib
              run: haxelib setup ~/haxelib

            - name: Restore libs
              id: libs
              uses: actions/cache/restore@v4
              with:
                path: .haxelib
                key: ios-hxpkg-v3-${{ hashFiles('.hxpkg') }}

            - name: Install libs
              if: steps.libs.outputs.cache-hit != 'true'
              run: |
                set -euo pipefail
                haxelib install hxpkg --quiet
                haxelib run hxpkg install

            - name: Save libs
              if: steps.libs.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                path: .haxelib
                key: ${{ steps.libs.outputs.cache-primary-key }}

            - name: Restore Lime
              id: lime
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: ios-lime-v3-${{ env.LIME_HASH }}-${{ env.IPHONE_VER }}

            - name: Build Lime
              if: steps.lime.outputs.cache-hit != 'true'
              timeout-minutes: 45
              run: |
                set -euo pipefail
                rm -rf "$LIME_DIR"
                git clone https://github.com/FunkinCrew/lime "$LIME_DIR"
                git -C "$LIME_DIR" checkout "$LIME_HASH"
                git -C "$LIME_DIR" submodule update --init --recursive --force --depth 1
                haxelib dev lime "$LIME_DIR"
                haxelib run lime rebuild mac -release < /dev/null
                ls "$LIME_DIR"/ndll/Mac*/lime.ndll
                cd "$LIME_DIR/project"
                haxelib run hxcpp Build.xml -Dios -DHXCPP_ARM64 -DIPHONE_VER=$IPHONE_VER < /dev/null
                ls "$LIME_DIR/ndll/iPhone"

            - name: Save Lime
              if: steps.lime.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                path: ${{ env.LIME_DIR }}
                key: ${{ steps.lime.outputs.cache-primary-key }}

            - name: Link Lime
              run: haxelib dev lime "$LIME_DIR"

            - name: Restore build cache
              uses: actions/cache/restore@v4
              with:
                path: ${{ env.HXCPP_COMPILE_CACHE }}
                key: ios-build-v3-${{ github.sha }}
                restore-keys: ios-build-v3-

            - name: Compile build
              timeout-minutes: 75
              run: |
                FLAGS=""
                if [ -n "$BUILD_FLAGS" ]; then FLAGS="-D $BUILD_FLAGS"; fi
                haxelib run lime build Project.xml ios -release -nosign $FLAGS < /dev/null

            - name: Save build cache
              if: always()
              uses: actions/cache/save@v4
              with:
                path: ${{ env.HXCPP_COMPILE_CACHE }}
                key: ios-build-v3-${{ github.sha }}

            - name: Package IPA
              run: |
                set -euo pipefail
                cd export/release/ios/build/Release-iphoneos
                rm -rf Payload
                mkdir Payload
                cp -R *.app Payload/
                zip -qry NightmareVision.ipa Payload

            - name: Publish artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                name: NightmareVision (iOS)
                path: export/release/ios/build/Release-iphoneos/NightmareVision.ipa
                compression-level: 0
